<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossiê Reforma Tributária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#0057b8;--azul2:#3385d6;--txt:#1a1a1a;--txt2:#4a4a4a;--bg:#ffffff;--alt:#f7f7f7;--linha:#e2e2e2;--escuro:#1a1a1a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;font-size:16px}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.mono{font-family:'DM Mono',ui-monospace,monospace}
a{color:var(--azul)}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
section{padding:88px 0}
section.alt{background:var(--alt)}
.sec-titulo{font-size:clamp(2.2rem,5vw,3.4rem);margin-bottom:40px;display:flex;align-items:center;gap:16px}
.sec-titulo::before{content:"";width:6px;height:.9em;background:var(--azul)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:2px solid var(--azul)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt)}
.logo i{width:30px;height:30px;background:var(--azul);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:block;position:relative}
.logo i::after{content:"";position:absolute;inset:9px;background:#fff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.logo span{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.08em}
.links{display:flex;gap:22px;list-style:none}
.links a{font-family:'DM Mono';font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt2);text-decoration:none}
.links a:hover{color:var(--azul)}
.lang{display:flex;border:1px solid var(--azul);flex-shrink:0}
.lang button{background:#fff;border:0;padding:6px 10px;font-family:'DM Mono';font-size:.75rem;cursor:pointer;color:var(--azul)}
.lang button.on{background:var(--azul);color:#fff}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:110px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:max(16px,calc(50% - 600px));top:120px;bottom:80px;width:3px;background:linear-gradient(var(--azul),transparent)}
.hero .wrap{padding-left:56px;width:100%}
.kicker{font-family:'DM Mono';font-size:.8rem;text-transform:uppercase;letter-spacing:.15em;color:var(--azul);margin-bottom:20px}
.hero h1{font-size:clamp(3.6rem,11vw,9rem)}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--azul)}
.hero h1 .l3{color:transparent;-webkit-text-stroke:2px var(--txt)}
.hero p{max-width:620px;color:var(--txt2);font-size:1.15rem;margin:28px 0 36px}
.countdown{display:inline-block;border-left:4px solid var(--azul);background:var(--alt);padding:16px 22px}
.countdown small{display:block;font-family:'DM Mono';font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt2)}
.countdown strong{display:block;font-weight:500;margin:4px 0 10px}
.cd{display:flex;gap:18px}
.cd div{text-align:center}
.cd b{display:block;font-family:'Bebas Neue';font-size:2.6rem;color:var(--azul);line-height:1}
.cd em{font-style:normal;font-family:'DM Mono';font-size:.68rem;text-transform:uppercase;color:var(--txt2)}
.cd2{margin-top:10px;font-family:'DM Mono';font-size:.75rem;color:var(--txt2)}

/* marquee */
.marquee{background:var(--azul);color:#fff;overflow:hidden;white-space:nowrap;padding:12px 0}
.marquee .trilho{display:inline-block;animation:rolar 70s linear infinite}
.marquee:hover .trilho{animation-play-state:paused}
.marquee span{font-family:'DM Mono';font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;margin-right:56px}
.marquee span::before{content:"◆ ";color:#bcd6f3}
@keyframes rolar{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);border:1px solid var(--linha)}
.kpi{background:#fff;padding:30px 26px;position:relative}
.kpi::before{content:"";position:absolute;top:0;left:0;height:3px;width:0;background:var(--azul);transition:width .4s}
.kpi:hover::before{width:100%}
.kpi b{font-family:'Bebas Neue';font-size:3rem;font-weight:400;color:var(--azul);display:block;line-height:1}
.kpi h3{font-family:'DM Sans';text-transform:none;letter-spacing:0;font-size:1rem;font-weight:700;margin:10px 0 4px}
.kpi p{font-size:.88rem;color:var(--txt2)}

/* novidades */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{background:#fff;border-left:4px solid var(--azul);padding:24px 26px;box-shadow:0 1px 0 var(--linha);position:relative}
.card .data{font-family:'DM Mono';font-size:.75rem;color:var(--azul)}
.card h3{font-family:'DM Sans';text-transform:none;letter-spacing:0;font-size:1.12rem;font-weight:700;margin:6px 0 8px;padding-right:56px}
.card p{color:var(--txt2);font-size:.95rem}
.card .ato{display:inline-block;margin-top:12px;font-family:'DM Mono';font-size:.72rem;background:var(--alt);padding:3px 8px;color:var(--txt2)}
.selo{position:absolute;top:18px;right:18px;background:var(--azul);color:#fff;font-family:'DM Mono';font-size:.65rem;padding:3px 8px;letter-spacing:.1em}

/* timeline */
.tl{position:relative;padding-left:40px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.tl-item{position:relative;margin-bottom:22px;cursor:pointer}
.tl-item::before{content:"";position:absolute;left:-35px;top:8px;width:14px;height:14px;border:2px solid var(--azul);background:#fff;border-radius:50%}
.tl-item.atual::before{background:var(--azul);box-shadow:0 0 0 6px rgba(0,87,184,.15)}
.tl-cab{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.tl-cab h3{font-size:2.2rem;color:var(--azul)}
.tl-cab strong{font-weight:700}
.badge{font-family:'DM Mono';font-size:.65rem;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor}
.badge.atual{background:var(--azul);color:#fff;border-color:var(--azul)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-family:'DM Mono';font-size:.68rem;padding:2px 8px;background:#e6eff9;color:var(--azul)}
.tag.t1{background:#e8f4ea;color:#1d6b33}.tag.t2{background:#fff3df;color:#8a5a00}
.tl-corpo{max-height:0;overflow:hidden;transition:max-height .4s}
.tl-item.aberto .tl-corpo{max-height:400px}
.tl-corpo ul{padding:12px 0 4px 18px;color:var(--txt2)}

/* tabela */
.tabela-wrap{overflow-x:auto;border:1px solid var(--linha)}
table{width:100%;border-collapse:collapse;background:#fff;min-width:640px}
th{font-family:'DM Mono';font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;text-align:left;background:var(--azul);color:#fff;padding:12px 16px}
td{padding:13px 16px;border-top:1px solid var(--linha);font-size:.93rem;vertical-align:top}
td:first-child{font-weight:700}
tr:hover td{background:#f2f7fd}

/* tributos e pilares */
.trib{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:56px}
.trib div{border:1px solid var(--linha);padding:28px;background:#fff}
.trib b{font-family:'Bebas Neue';font-size:3.4rem;font-weight:400;color:var(--azul);line-height:1}
.trib h3{font-family:'DM Sans';text-transform:none;letter-spacing:0;font-size:1.05rem;margin-top:6px}
.trib small{display:block;font-family:'DM Mono';font-size:.72rem;color:var(--txt2);margin:4px 0 12px}
.trib p{color:var(--txt2);font-size:.93rem}
.pilares{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);border:1px solid var(--linha)}
.pilares div{background:#fff;padding:24px}
.pilares h4{font-family:'DM Mono';font-size:.8rem;text-transform:uppercase;color:var(--azul);margin-bottom:6px}
.pilares p{font-size:.92rem;color:var(--txt2)}

/* impactos */
.imp{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.imp div.c{background:#fff;padding:26px;border-top:3px solid var(--azul)}
.imp h3{font-size:1.8rem}
.imp p{color:var(--txt2);font-size:.94rem;margin:6px 0 16px}
.urg small{font-family:'DM Mono';font-size:.7rem;text-transform:uppercase;color:var(--txt2);display:flex;justify-content:space-between}
.barra{height:6px;background:var(--linha);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul2),var(--azul));transition:width 1.4s ease}

/* citacao */
.citacao{background:var(--escuro);color:#fff;padding:80px 0}
.citacao blockquote{font-family:'Bebas Neue';font-size:clamp(1.9rem,4.5vw,3.2rem);letter-spacing:.03em;line-height:1.15;max-width:960px;border-left:4px solid var(--azul2);padding-left:28px}
.citacao cite{display:block;margin-top:18px;font-family:'DM Mono';font-style:normal;font-size:.78rem;color:#9fb9d8;padding-left:32px}

/* checklist */
.prog{font-family:'DM Mono';font-size:.85rem;margin-bottom:18px;color:var(--azul)}
.prog .barra{max-width:420px}
.chk{list-style:none;border:1px solid var(--linha);background:#fff}
.chk li{display:flex;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--linha);cursor:pointer;user-select:none}
.chk li:first-child{border-top:0}
.chk li:hover{background:#f2f7fd}
.box{width:22px;height:22px;border:2px solid var(--azul);flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:.8rem}
.chk li.ok .box{background:var(--azul)}
.chk li.ok .t{text-decoration:line-through;color:#999}
.chk .t{flex:1}
.chk .p{font-family:'DM Mono';font-size:.75rem;color:var(--txt2);white-space:nowrap}

/* genomma */
.intro{max-width:860px;color:var(--txt2);margin:-16px 0 32px}
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.gcard{background:#fff;border:1px solid var(--linha);border-top:4px solid var(--azul);padding:26px;display:flex;flex-direction:column}
.gcard:last-child:nth-child(odd){grid-column:1/-1}
.g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.g-cat{font-family:'Bebas Neue';font-size:1.9rem;letter-spacing:.04em;line-height:1}
.g-st{font-family:'DM Mono';font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;white-space:nowrap;background:#e8f4ea;color:#1d6b33}
.g-st.parcial{background:#fff3df;color:#8a5a00}
.g-enq{font-weight:700;color:var(--azul);font-size:1.02rem}
.g-base{font-family:'DM Mono';font-size:.72rem;color:var(--txt2);margin-bottom:10px}
.g-ex{font-size:.86rem;color:var(--txt2);margin-bottom:8px}
.g-ex b{font-weight:500;color:var(--txt)}
.gcard>p.g-txt{font-size:.92rem;color:var(--txt2);flex:1}
.g-dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linha);margin:16px 0}
.g-dl div{background:var(--alt);padding:10px 12px}
.g-dl dt{font-family:'DM Mono';font-size:.66rem;text-transform:uppercase;color:var(--txt2)}
.g-dl dd{font-family:'Bebas Neue';font-size:1.6rem;color:var(--azul);line-height:1.1}
.transv{margin-top:48px;background:#fff;border-left:4px solid var(--azul);padding:26px 30px}
.transv h3{font-size:1.6rem;margin-bottom:10px}
.transv ul{padding-left:20px;color:var(--txt2)}
.transv li{margin:6px 0}

/* comex */
.comex{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
.cx{background:#fff;border:1px solid var(--linha)}
.cx h3{background:var(--azul);color:#fff;font-size:1.6rem;padding:12px 20px}
.cx ul{list-style:none}
.cx li{padding:14px 20px;border-top:1px solid var(--linha)}
.cx li:first-child{border-top:0}
.cx strong{display:block;font-size:.95rem}
.cx p{font-size:.88rem;color:var(--txt2);margin-top:2px}
.ac{display:inline-block;margin-left:6px;font-family:'DM Mono';font-size:.6rem;text-transform:uppercase;background:#fff3df;color:#8a5a00;padding:1px 6px;vertical-align:middle;font-weight:400}

/* entidades */
.ent{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:56px}
.ent div{background:#fff;border:1px solid var(--linha);padding:20px;display:flex;flex-direction:column}
.ent h3{font-size:1.5rem;color:var(--azul)}
.ent small{font-family:'DM Mono';font-size:.68rem;color:var(--txt2);text-transform:uppercase;margin-bottom:8px}
.ent p{font-size:.86rem;color:var(--txt2);flex:1}
.ent a{font-family:'DM Mono';font-size:.72rem;margin-top:12px;text-transform:uppercase;text-decoration:none}

/* fontes */
.fontes{columns:2;column-gap:40px;list-style:none}
.fontes li{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--linha);font-size:.92rem}
.fontes a{text-decoration:none}.fontes a:hover{text-decoration:underline}

footer{border-top:4px solid var(--azul);padding:40px 0;font-size:.85rem;color:var(--txt2)}
footer .mono{font-size:.75rem;margin-top:10px}
.print{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--azul);color:#fff;border:0;padding:13px 18px;font-family:'DM Mono';font-size:.78rem;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(0,87,184,.35)}
.print:hover{background:var(--azul2)}

/* animacao */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

@media (max-width:1180px){
  .links{gap:14px}
  .links a{font-size:.66rem}
  .ent{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1040px){ .links{display:none} }
@media (max-width:900px){
  .kpis,.trib,.pilares,.ent{grid-template-columns:repeat(2,1fr)}
  .cards,.imp,.gcards,.comex{grid-template-columns:1fr}
  .fontes{columns:1}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .hero .wrap{padding-left:30px}
  section{padding:60px 0}
  .kpis,.trib,.pilares,.ent{grid-template-columns:1fr}
  .g-dl{grid-template-columns:1fr}
  .cd{gap:12px}.cd b{font-size:2rem}
  .chk li{flex-wrap:wrap}
  .print{right:12px;bottom:12px}
}
@media print{
  nav,.print,.marquee,.lang{display:none!important}
  .hero{min-height:auto;padding-top:20px}
  section{padding:24px 0;break-inside:avoid-page}
  .rv{opacity:1!important;transform:none!important}
  .tl-corpo{max-height:none!important}
  .citacao{background:#fff;color:#000}
  .citacao blockquote{border-color:var(--azul)}
  .barra i{width:var(--w)!important}
  a{color:#000}
}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#topo"><i></i><span>Dossiê RT</span></a>
  <ul class="links" id="nav-links"></ul>
  <div class="lang"><button data-l="pt">🇧🇷 PT</button><button data-l="es">🇪🇸 ES</button></div>
</div></nav>

<header class="hero" id="topo"><div class="wrap">
  <div class="kicker" id="kicker"></div>
  <h1 id="hero-h1"></h1>
  <p id="hero-p"></p>
  <div class="countdown">
    <small id="cd-rotulo"></small>
    <strong id="cd-marco"></strong>
    <div class="cd" id="cd"></div>
    <div class="cd2" id="cd2"></div>
  </div>
</div></header>

<div class="marquee"><div class="trilho" id="marquee"></div></div>

<section><div class="wrap"><h2 class="sec-titulo rv" data-s="kpis"></h2><div class="kpis" id="kpis"></div></div></section>
<section class="alt" id="novidades"><div class="wrap"><h2 class="sec-titulo rv" data-s="novidades"></h2><div class="cards" id="cards"></div></div></section>
<section id="genomma"><div class="wrap">
  <h2 class="sec-titulo rv" data-s="genomma"></h2><p class="intro rv" id="g-intro"></p>
  <div class="gcards" id="gcards"></div>
  <div class="transv rv"><h3 data-s="transversais"></h3><ul id="transv"></ul></div>
</div></section>
<section class="alt" id="cronograma"><div class="wrap"><h2 class="sec-titulo rv" data-s="cronograma"></h2><div class="tl" id="tl"></div></div></section>
<section id="aliquotas"><div class="wrap"><h2 class="sec-titulo rv" data-s="aliquotas"></h2><div class="tabela-wrap rv"><table id="tab"></table></div></div></section>
<section class="alt" id="tributos"><div class="wrap">
  <h2 class="sec-titulo rv" data-s="tributos"></h2><div class="trib" id="trib"></div>
  <h2 class="sec-titulo rv" data-s="mecanismos"></h2><div class="pilares" id="pilares"></div>
</div></section>
<section id="impactos"><div class="wrap"><h2 class="sec-titulo rv" data-s="impactos"></h2><div class="imp" id="imp"></div></div></section>
<section class="alt" id="comex"><div class="wrap">
  <h2 class="sec-titulo rv" data-s="comex"></h2><p class="intro rv" id="cx-intro"></p>
  <div class="comex" id="cx"></div>
</div></section>
<div class="citacao"><div class="wrap"><blockquote id="cit"></blockquote><cite id="cit-a"></cite></div></div>
<section id="checklist"><div class="wrap">
  <h2 class="sec-titulo rv" data-s="checklist"></h2>
  <div class="prog"><span id="prog-t"></span><div class="barra"><i id="prog-b"></i></div></div>
  <ul class="chk" id="chk"></ul>
</div></section>
<section class="alt" id="fontes"><div class="wrap">
  <h2 class="sec-titulo rv" data-s="entidades"></h2><div class="ent" id="ent"></div>
  <h2 class="sec-titulo rv" data-s="fontes"></h2><ul class="fontes" id="fnt"></ul>
</div></section>

<footer><div class="wrap"><p id="disc"></p><p class="mono" id="rod"></p></div></footer>
<button class="print" id="btn-print" onclick="window.print()"></button>

          { "t": "Créditos", "d": "El importador del régimen regular acredita el IBS/CBS pagado. Hay crédito presunto de CBS sobre el PIS/Cofins-Importación de inventarios (cálculo hasta jun/2027, en 12 cuotas).", "ok": false }
        ] },
        { "titulo": "Exportación", "itens": [
          { "t": "Inmunidad con mantenimiento de créditos", "d": "Las exportaciones de bienes y servicios no soportan IBS/CBS, y se mantienen los créditos de etapas anteriores para compensación o resarcimiento (LC 214/2025, art. 79).", "ok": true },
          { "t": "IBS y CBS segregados", "d": "El crédito de IBS no compensa débito de CBS, y viceversa. Controlar los saldos por separado.", "ok": true },
          { "t": "Comercializadora exportadora", "d": "Suspensión en la venta a la trading, convertida en alícuota cero tras la exportación. Exige requisitos acumulativos, como certificación OEA y patrimonio neto mínimo (art. 82).", "ok": true },
          { "t": "Exportación indirecta en disputa", "d": "Decisión de primera instancia (TJDFT, 08/05/2026, mandado de seguridad del CECIEX) apartó los requisitos del art. 82 para el IBS. No es definitiva.", "ok": false }
        ] },
        { "titulo": "Regímenes aduaneros especiales", "itens": [
          { "t": "Drawback, Recof, Repetro, ZPE y ZFM", "d": "Incorporados por el Decreto 12.955/2026 y la Resolución CGIBS 6/2026, con suspensión de IBS/CBS como mecanismo de neutralidad, condicionada a control y trazabilidad.", "ok": true },
          { "t": "Drawback suspensión", "d": "Hay lecturas divergentes sobre la extensión de la suspensión al IBS/CBS. Confirmar en el reglamento antes de planificar operaciones.", "ok": false },
          { "t": "Zona Franca de Manaus", "d": "IPI mantenido para productos industrializados en la ZFM. Las empresas en la ZFM deben informar el número de proceso Suframa en la NF-e.", "ok": true }
        ] }
      ]
    },
    "entidades": [
      { "nome": "Sindusfarma", "papel": "Industria farmacéutica", "texto": "Grupo de trabajo con la CMED sobre la adaptación de precios a la reforma; nueva Resolución CMED n.º 3/25 vigente desde el 29/04/2026.", "url": "https://sindusfarma.org.br/noticias/indice/exibir/27681-nova-resolucao-da-cmed-e-reforma-tributaria-sindusfarma-reune-industria-para-esclarecer-regras-e-impactos" },
      { "nome": "ABIHPEC", "papel": "Higiene personal, perfumería y cosméticos", "texto": "Guía de CBS/IBS para el sector (18/08/2026): Anexo VIII, fin del ICMS-ST, checklist de ERP y caja.", "url": "https://abihpec.org.br/cbs-ibs-empresas-cosmeticos-2026/" },
      { "nome": "ACESSA", "papel": "Autocuidado en salud y MIP", "texto": "No se localizó posicionamiento público sobre la reforma en el sitio hasta el 03/11/2026. Seguir la sección MIP & Autocuidado, en especial el compromiso exigido para MIP con precio liberado.", "url": "https://acessa.org.br/mip-autocuidado" },
      { "nome": "Rayes & Fagundes", "papel": "Despacho de abogados tributarios", "texto": "Boletín sobre medicamentos: IBS/CBS en la base del ICMS, PMC, ICMS-ST, compras públicas y contratos. Visto en una publicación de LinkedIn; el texto original no pudo consultarse automáticamente (por confirmar).", "url": "https://www.rayesfagundes.com.br" },
      { "nome": "CMED / Anvisa", "papel": "Regulación de precios de medicamentos", "texto": "GT de Reforma Tributaria: presentación del 03/07/2026 con la propuesta del nuevo modelo de precio de fábrica y escalonamiento 2027/2029/2033.", "url": "https://www.gov.br/anvisa/pt-br/assuntos/medicamentos/cmed/informes/ApresentaoGTdeReformaTributria03dejulhode2026.pdf" }
    ],
    "checklist": [
      { "texto": "Homologar NF-e con la NT 2025.002 v1.53 (reglas de devolución)", "prazo": "09/11/2026" },
      { "texto": "Pasar a producción con las NT 2026.005 a 2026.008", "prazo": "16/11/2026" },
      { "texto": "Mapear NCM, registro Anvisa y cClassTrib de cada SKU (OTC, dermo, higiene, Suerox, Novamil)", "prazo": "Nov/2026" },
      { "texto": "Cooperativas: formalizar opción por el régimen específico (plazo por confirmar)", "prazo": "30/11/2026" },
      { "texto": "Simples: revisar/cancelar la opción por el régimen regular, si corresponde", "prazo": "30/11/2026" },
      { "texto": "Adecuar la emisión al nuevo DANFE (NT 2026.010) — fecha por confirmar", "prazo": "01/12/2026" },
      { "texto": "Migrar todas las importaciones de la DI a la DUIMP — fecha por confirmar", "prazo": "01/12/2026" },
      { "texto": "OTC con precio liberado: evaluar compromiso con la Unión/CGIBS para mantener la reducción del 60%", "prazo": "Dic/2026" },
      { "texto": "Jabones en barra: validar NCM y descripción frente al Anexo VIII", "prazo": "Dic/2026" },
      { "texto": "Suerox: confirmar NCM y exposición al Impuesto Selectivo", "prazo": "Dic/2026" },
      { "texto": "Seguir la resolución del Senado sobre la alícuota de la CBS 2027", "prazo": "Dic/2026" },
      { "texto": "Inventariar existencias al 31/12/2026 para crédito presunto de CBS", "prazo": "31/12/2026" },
      { "texto": "Actualizar precios y contratos para la CBS plena", "prazo": "01/01/2027" },
      { "texto": "Calcular el crédito presunto de CBS sobre el PIS/Cofins-Importación de inventarios", "prazo": "Jun/2027" },
      { "texto": "Exportaciones: estructurar el control y la solicitud de resarcimiento de créditos", "prazo": "2027" },
      { "texto": "Preparar tesorería y sistemas para el split payment", "prazo": "2.º sem./2027" }
    ],
    "fontes": []
  }
}</script>
<script>
(function(){
  'use strict';
  var D = JSON.parse(document.getElementById('dados').textContent);
  var ids = ['novidades','genomma','cronograma','aliquotas','tributos','impactos','comex','checklist','fontes'];
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  var CHK_KEY = 'dossie-rt-checklist-v2';
  var lang = store.get('dossie-rt-lang');
  if (!D[lang]) lang = 'pt';
  var feitos = {};
  try { feitos = JSON.parse(store.get(CHK_KEY) || '{}') || {}; } catch(e){ feitos = {}; }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function parseBR(s){ var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }

  var timer = null;
  function contagem(L){
    var alvo = new Date(L.meta.marco.data), sec = new Date(L.meta.marcoSecundario.data), u = L.ui.contagemUnid;
    function tick(){
      var agora = new Date(), d = alvo - agora;
      if (d <= 0) { $('cd').innerHTML = '<div><b>✓</b><em>' + esc(L.ui.contagemPassou) + '</em></div>'; }
      else {
        var v = [Math.floor(d/864e5), Math.floor(d/36e5)%24, Math.floor(d/6e4)%60, Math.floor(d/1e3)%60];
        $('cd').innerHTML = v.map(function(n,i){ return '<div><b>' + (i ? String(n).padStart(2,'0') : n) + '</b><em>' + esc(u[i]) + '</em></div>'; }).join('');
      }
      var d2 = Math.ceil((sec - agora)/864e5);
      $('cd2').textContent = d2 > 0 ? '→ ' + L.meta.marcoSecundario.rotulo + ': ' + d2 + ' ' + u[0] : '';
    }
    clearInterval(timer); tick(); timer = setInterval(tick, 1000);
  }

  function progresso(L){
    var n = L.checklist.length, x = 0;
    for (var i = 0; i < n; i++) if (feitos[i]) x++;
    $('prog-t').textContent = L.ui.contador.replace('{x}', x).replace('{n}', n);
    $('prog-b').style.width = (n ? x/n*100 : 0) + '%';
  }

  function render(){
    var L = D[lang], ui = L.ui;
    document.documentElement.lang = L.meta.lang;
    document.title = L.meta.titulo;
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });

    $('nav-links').innerHTML = ui.nav.map(function(t,i){ return '<li><a href="#' + ids[i] + '">' + esc(t) + '</a></li>'; }).join('');
    $('kicker').textContent = ui.heroKicker;
    $('hero-h1').innerHTML = ui.heroLinhas.map(function(t,i){ return '<span class="l' + (i+1) + '">' + esc(t) + '</span>'; }).join('');
    $('hero-p').textContent = ui.heroTexto;
    $('cd-rotulo').textContent = ui.contagemRotulo;
    $('cd-marco').textContent = L.meta.marco.rotulo + ' — ' + new Date(L.meta.marco.data).toLocaleDateString(L.meta.lang);
    contagem(L);

    document.querySelectorAll('[data-s]').forEach(function(h){ h.textContent = ui.secoes[h.dataset.s]; });

    var mq = L.novidades.map(function(n){ return '<span>' + esc(n.data + ' · ' + n.titulo) + '</span>'; }).join('');
    $('marquee').innerHTML = mq + mq;

    $('kpis').innerHTML = L.kpis.map(function(k){ return '<div class="kpi rv"><b>' + esc(k.valor) + '</b><h3>' + esc(k.rotulo) + '</h3><p>' + esc(k.nota) + '</p></div>'; }).join('');

    $('cards').innerHTML = L.novidades.map(function(n){
      return '<article class="card rv">' + (n.novo ? '<span class="selo">' + esc(ui.novo) + '</span>' : '') +
        '<div class="data">' + esc(n.data) + '</div><h3>' + esc(n.titulo) + '</h3><p>' + esc(n.resumo) + '</p><span class="ato">' + esc(n.ato) + '</span></article>';
    }).join('');

    var G = L.genomma, g = ui.g;
    $('g-intro').textContent = G.intro;
    $('gcards').innerHTML = G.itens.map(function(c){
      return '<article class="gcard rv"><div class="g-top"><span class="g-cat">' + esc(c.categoria) + '</span><span class="g-st ' + esc(c.status) + '">' + esc(g.status[c.status]) + '</span></div>' +
        '<div class="g-enq">' + esc(c.enquadramento) + '</div><div class="g-base">' + esc(c.base) + '</div>' +
        '<p class="g-ex"><b>' + esc(g.exemplos) + ':</b> ' + esc(c.exemplos) + '</p><p class="g-txt">' + esc(c.texto) + '</p>' +
        '<dl class="g-dl"><div><dt>' + esc(g.cbs) + '</dt><dd>' + esc(c.cbs) + '</dd></div><div><dt>' + esc(g.is) + '</dt><dd>' + esc(c.is) + '</dd></div></dl>' +
        '<div class="urg"><small><span>' + esc(ui.urgencia) + '</span><span>' + c.urgencia + '%</span></small><div class="barra"><i data-w="' + c.urgencia + '" style="--w:' + c.urgencia + '%"></i></div></div></article>';
    }).join('');
    $('transv').innerHTML = G.transversais.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');

    $('cx-intro').textContent = L.comex.intro;
    $('cx').innerHTML = L.comex.blocos.map(function(b){
      return '<div class="cx rv"><h3>' + esc(b.titulo) + '</h3><ul>' + b.itens.map(function(i){
        return '<li><strong>' + esc(i.t) + (i.ok ? '' : '<span class="ac">' + esc(ui.aConfirmar) + '</span>') + '</strong><p>' + esc(i.d) + '</p></li>';
      }).join('') + '</ul></div>';
    }).join('');

    var ents = (L.entidades && L.entidades.length) ? L.entidades : D.pt.entidades;
    $('ent').innerHTML = ents.map(function(e){
      return '<div class="rv"><h3>' + esc(e.nome) + '</h3><small>' + esc(e.papel) + '</small><p>' + esc(e.texto) + '</p><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(ui.acessar) + ' ↗</a></div>';
    }).join('');

    var anoAtual = new Date().getFullYear();
    $('tl').innerHTML = L.cronograma.map(function(c){
      var p = c.ano.split(/[–-]/).map(Number), atual = anoAtual >= p[0] && anoAtual <= (p[1] || p[0]);
      return '<div class="tl-item rv' + (atual ? ' atual aberto' : '') + '"><div class="tl-cab"><h3>' + esc(c.ano) + '</h3><strong>' + esc(c.titulo) + '</strong>' +
        (atual ? '<span class="badge atual">' + esc(ui.atual) + '</span>' : '') + '</div><div class="tags">' +
        c.tags.map(function(t,i){ return '<span class="tag t' + (i%3) + '">' + esc(t) + '</span>'; }).join('') +
        '</div><div class="tl-corpo"><ul>' + c.itens.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div></div>';
    }).join('');
    document.querySelectorAll('.tl-item').forEach(function(el){ el.addEventListener('click', function(){ el.classList.toggle('aberto'); }); });

    $('tab').innerHTML = '<thead><tr>' + ui.tabela.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      L.aliquotas.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>';

    $('trib').innerHTML = L.tributos.map(function(t){ return '<div class="rv"><b>' + esc(t.sigla) + '</b><h3>' + esc(t.nome) + '</h3><small>' + esc(t.esfera) + '</small><p>' + esc(t.texto) + '</p></div>'; }).join('');
    $('pilares').innerHTML = L.mecanismos.map(function(m){ return '<div class="rv"><h4>' + esc(m.titulo) + '</h4><p>' + esc(m.texto) + '</p></div>'; }).join('');

    $('imp').innerHTML = L.impactos.map(function(m){
      return '<div class="c rv"><h3>' + esc(m.titulo) + '</h3><p>' + esc(m.texto) + '</p><div class="urg"><small><span>' + esc(ui.urgencia) + '</span><span>' + m.urgencia + '%</span></small>' +
        '<div class="barra"><i data-w="' + m.urgencia + '" style="--w:' + m.urgencia + '%"></i></div></div></div>';
    }).join('');

    $('cit').textContent = '“' + ui.citacao + '”';
    $('cit-a').textContent = '— ' + ui.citacaoAutor;

    var hoje = new Date(); hoje.setHours(0,0,0,0);
    $('chk').innerHTML = L.checklist.map(function(c,i){
      return '<li data-i="' + i + '" class="' + (feitos[i] ? 'ok' : '') + '"><span class="box">✓</span><span class="t">' + esc(c.texto) + '</span><span class="p">' + esc(ui.prazo) + ': ' + esc(c.prazo) + '</span></li>';
    }).join('');
    document.querySelectorAll('#chk li').forEach(function(li){
      li.addEventListener('click', function(){
        var i = li.dataset.i; feitos[i] = !feitos[i]; li.classList.toggle('ok', feitos[i]);
        store.set(CHK_KEY, JSON.stringify(feitos)); progresso(D[lang]);
      });
    });
    progresso(L);

    var fontes = (L.fontes && L.fontes.length) ? L.fontes : D.pt.fontes;
    $('fnt').innerHTML = fontes.map(function(f){ return '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.titulo) + ' ↗</a></li>'; }).join('');

    $('disc').textContent = ui.disclaimer;
    $('rod').textContent = ui.rodapeAtualizacao + ' ' + L.meta.atualizacao + ' · ' + L.meta.ultimaPublicacao;
    $('btn-print').textContent = '⎙ ' + ui.imprimir;

    observar();
  }

  var io = null;
  function observar(){
    var els = document.querySelectorAll('.rv:not(.in)');
    if (!('IntersectionObserver' in window)) { els.forEach(mostrar); return; }
    if (!io) io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ mostrar(e.target); io.unobserve(e.target); } }); }, {threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  }
  function mostrar(el){
    el.classList.add('in');
    el.querySelectorAll('.barra i[data-w]').forEach(function(b){ b.style.width = b.dataset.w + '%'; });
  }

  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ lang = b.dataset.l; store.set('dossie-rt-lang', lang); render(); });
  });
  window.addEventListener('beforeprint', function(){ document.querySelectorAll('.rv').forEach(mostrar); });
  render();
})();
</script>
</body>
</html>
